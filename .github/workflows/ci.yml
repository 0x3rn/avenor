name: Avenor CI

on:
  push:
    branches: [main, working]
  pull_request:
    branches: [main, working]

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      APP_ENV: test
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/avenor_test' }}
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/avenor_test' }}
      BETTER_AUTH_SECRET: "ci-verification-secret-key-minimum-32-characters-long-987654"
      BETTER_AUTH_URL: "http://localhost:3000"
      ENCRYPTION_MASTER_KEY: "fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210"
      NEXT_PUBLIC_APP_NAME: "Avenor"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.11.2 --activate

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome linter
        run: pnpm lint

      - name: Run Biome format check
        run: pnpm format:check

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Validate database configuration & schema
        run: pnpm db:validate

      - name: Run unit tests & coverage
        run: pnpm test:coverage

      - name: Build production Next.js bundle
        run: pnpm build
